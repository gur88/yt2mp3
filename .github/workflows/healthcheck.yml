name: Health check

# Catches the class of problem the error log does not show. The 2026-08-25
# incident — three jobs stuck on a livestream, downloads/ at 6.7GB, disk at 86%
# with roughly fifteen minutes of headroom left — produced no alarming log
# entries at all; it was only noticed because someone happened to look.
#
# The checks and thresholds themselves live in ops/healthcheck.sh, which the
# on-box systemd timer runs too. Keeping them in one file is the point: the two
# callers would otherwise drift apart, and a monitor that disagrees with itself
# is worse than none.
#
# This caller's real job is the one the timer structurally cannot do: a monitor
# running on the server cannot report that the server is unreachable. If SSH
# fails here, the run fails and GitHub emails. Frequency matters less for that,
# which is just as well — measured on 2026-08-27, GitHub ran this 8 times in 30
# hours with a 10-hour overnight gap, so the hourly cron below is a request, not
# a promise. The timer covers cadence; this covers "is it there at all".
#
# Also worth knowing: GitHub only runs schedules from the default branch, and
# disables them after 60 days without repo activity.
#
# No --notify here, so this path never sends Telegram messages — the timer owns
# notification, and duplicate alerts from two sources would be noise.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Invoked through `sh` rather than relying on the executable bit,
          # which does not survive a checkout from a Windows working tree.
          script: sh /var/www/yt2mp3/ops/healthcheck.sh
